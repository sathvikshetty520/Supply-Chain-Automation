[project]
name = "scdisrupt"
version = "0.1.0"
description = "Autonomous Supply-Chain Disruption Simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pulp>=2.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "anthropic>=0.18.0",
    "scipy>=1.12.0",
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
